<script id="domain">
/* Pure calculation functions, shared with the dependency-free Node test suite. */
globalThis.Domain = (() => {
  function decimal(value, digits, max = null) {
    const text=String(value).trim();
    if(!new RegExp('^\\d+(?:\\.\\d{1,'+digits+'})?$').test(text)) throw new Error('decimal');
    const [a,b='']=text.split('.'); const n=BigInt(a)*10n**BigInt(digits)+BigInt(b.padEnd(digits,'0'));
    if(max!==null && n>max) throw new Error('range'); return n;
  }
  function integer(value,max){if(!/^\d+$/.test(String(value)))throw new Error('integer');const n=Number(value);if(!Number.isSafeInteger(n)||n<1||n>max)throw new Error('range');return n;}
  function plan(rows, fee, extra, buffer){
    if(!Array.isArray(rows)||rows.length<1||rows.length>30)throw new Error('rows');
    const gwei=decimal(fee,9,100000n*10n**9n), reserve=decimal(buffer,2,100000n);
    const operations=rows.map(r=>{const gas=BigInt(integer(r.gas,100000000))*BigInt(integer(r.count,1000));return {gas,execution:gas*gwei};});
    const gas=operations.reduce((sum,r)=>sum+r.gas,0n);
    const execution=gas*gwei, additional=extra===''?0n:decimal(extra,18,1000n*10n**18n);
    const subtotal=execution+additional;
    const total=(subtotal*(10000n+reserve)+9999n)/10000n;
    return {gas,execution,additional,subtotal,total,operations};
  }
  function eth(wei){const whole=wei/10n**18n, frac=(wei%10n**18n).toString().padStart(18,'0').replace(/0+$/,'');return whole.toString()+(frac?'.'+frac:'');}
  function rpcGwei(hex){if(typeof hex!=='string'||!/^0x[0-9a-f]+$/i.test(hex))throw new Error('rpc');const n=BigInt(hex);if(n>100000n*10n**9n)throw new Error('range');return (n/10n**9n).toString()+'.'+(n%10n**9n).toString().padStart(9,'0');}
  function csvCell(value){let s=String(value);if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
  function restore(v){
    if(!v||v.version!==1||!v.plan)throw Error('backup');
    const p=v.plan, types=['transfer','token','approval','swap','custom'];
    if(!['ru','en'].includes(p.lang)||!Array.isArray(p.rows)||!p.rows.every(r=>r&&types.includes(r.type)&&typeof r.gas==='string'&&typeof r.count==='string'))throw Error('rows');
    for(const k of ['rates','extras'])if(!Array.isArray(p[k])||p[k].length!==3||!p[k].every(x=>typeof x==='string'))throw Error('networks');
    if(typeof p.buffer!=='string'||typeof p.price!=='string'||(p.price!==''&&(!/^\d+(\.\d+)?$/.test(p.price)||Number(p.price)<=0||Number(p.price)>1e9)))throw Error('price');
    for(let i=0;i<3;i++)plan(p.rows,p.rates[i],p.extras[i],p.buffer);
    return {lang:p.lang,rows:p.rows.map(r=>({type:r.type,gas:r.gas,count:r.count})),price:p.price,buffer:p.buffer,rates:[...p.rates],extras:[...p.extras],times:[0,0,0],modes:['manual','manual','manual'],priceTime:0};
  }
  return {decimal,integer,plan,eth,rpcGwei,csvCell,restore};
})();

</script>

function render(){translated();$('price').value=state.price;$('buffer').value=state.buffer;
 $('operations').innerHTML=state.rows.map((r,i)=>`<div class="operation"><label class="field">${t('type')} ${i+1}<select data-row="${i}" data-key="type">${Object.keys(presets).map(k=>`<option value="${k}" ${r.type===k?'selected':''}>${t(k)}</option>`).join('')}</select></label><label class="field">${t('gas')}<input inputmode="numeric" data-row="${i}" data-key="gas" aria-label="${t('gas')} · ${t('type')} ${i+1}" value="${esc(r.gas)}"></label><label class="field">${t('count')}<input inputmode="numeric" data-row="${i}" data-key="count" aria-label="${t('count')} · ${t('type')} ${i+1}" value="${esc(r.count)}"></label><button class="remove" data-remove="${i}" aria-label="${t('remove')} ${i+1}" ${state.rows.length===1?'disabled':''}>×</button></div>`).join('');
 $('networks').innerHTML=names.map((name,i)=>`<section class="network ${i===0?'top':''}"><div class="network-title"><h3>${name}</h3><span class="badge" style="color:var(--ink)">${i===0?'L1':'L2'}</span></div><div class="fields"><label class="field">${t('rate')}<input inputmode="decimal" aria-label="${name} ${t('rate')}" data-network="${i}" data-key="rate" value="${esc(state.rates[i])}"></label>${i?`<label class="field">${t('extra')}<input inputmode="decimal" aria-label="${name} ${t('extra')}" data-network="${i}" data-key="extra" value="${esc(state.extras[i])}" placeholder="—"></label>`:''}</div><small id="stamp${i}" style="margin-top:12px"></small><div class="amount" id="result${i}">—</div><small id="fiat${i}"></small><div id="breakdown${i}" class="table-wrap"></div><p class="note" id="scope${i}"></p></section>`).join('');
 $('add').disabled=state.rows.length>=30||blocked;calculate();stamps();if(blocked)document.querySelectorAll('input,select,button').forEach(el=>el.disabled=el.id!=='export'&&el.id!=='backupJson');}
function stamps(){names.forEach((_,i)=>{$('stamp'+i).textContent=state.modes[i]==='live'?t('updated')+' '+new Date(state.times[i]).toLocaleTimeString(state.lang)+(Date.now()-state.times[i]>300000?' · '+t('stale'):''):t(state.modes[i]==='manual'?'manual':'sample');});$('priceStamp').textContent=state.priceTime?t('updated')+' '+new Date(state.priceTime).toLocaleTimeString(state.lang)+' · Coinbase'+(Date.now()-state.priceTime>300000?' · '+t('stale'):''):t('manual');}
function results(){if(state.price!==''&&(!/^\d+(\.\d+)?$/.test(state.price)||Number(state.price)<=0||Number(state.price)>1e9))throw Error('price');return names.map((_,i)=>D.plan(state.rows,state.rates[i],state.extras[i],state.buffer));}
function calculate(){try{const all=results();$('error').textContent='';all.forEach((r,i)=>{$('result'+i).textContent=D.eth(r.total)+' ETH';$('fiat'+i).textContent=state.price?new Intl.NumberFormat(state.lang,{style:'currency',currency:'USD'}).format(Number(D.eth(r.total))*Number(state.price)):t('emptyPrice');$('scope'+i).textContent=i&&state.extras[i]===''?t('partial'):t('complete');$('breakdown'+i).innerHTML=`<table><caption class="sr-only">${names[i]} ${t('budget')}</caption><tbody>${[[t('execution'),D.eth(r.execution)+' ETH'],[t('additional'),state.extras[i]===''?t('unknownFee'):D.eth(r.additional)+' ETH'],[t('reserveAmount'),D.eth(r.total-r.subtotal)+' ETH']].map(([label,value])=>`<tr><th scope="row">${label}</th><td>${value}</td></tr>`).join('')}</tbody></table><details><summary>${t('operationCosts')}</summary><p class="note">${t('operationNote')}</p><table><thead><tr><th>${t('type')}</th><th>${t('count')}</th><th>${t('execution')} · ETH</th></tr></thead><tbody>${r.operations.map((op,j)=>`<tr><th scope="row">${j+1}. ${t(state.rows[j].type)}</th><td>${esc(state.rows[j].count)}</td><td>${D.eth(op.execution)}</td></tr>`).join('')}</tbody></table></details>`;});$('gasTotal').textContent=all[0].gas.toLocaleString(state.lang);$('txTotal').textContent=state.rows.reduce((s,r)=>s+Number(r.count),0);$('reserveTotal').textContent=state.buffer+'%';$('export').disabled=false;}catch(_){$('error').textContent=t('invalid');names.forEach((_,i)=>{$('result'+i).textContent='—';$('fiat'+i).textContent='';$('scope'+i).textContent='';$('breakdown'+i).innerHTML='';});$('gasTotal').textContent=$('txTotal').textContent=$('reserveTotal').textContent='—';$('export').disabled=true;}}
$('operations').addEventListener('change',e=>{const el=e.target;if(el.dataset.row===undefined||blocked)return;const row=state.rows[Number(el.dataset.row)];row[el.dataset.key]=el.value;if(el.dataset.key==='type'){row.gas=String(presets[el.value]);const index=Number(el.dataset.row);render();$('operations').querySelectorAll('select')[index].focus();}save();calculate();});
$('operations').addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(!b||blocked||state.rows.length===1)return;const index=Number(b.dataset.remove);state.rows.splice(index,1);save();render();$('operations').querySelectorAll('select')[Math.min(index,state.rows.length-1)].focus();});
$('add').onclick=()=>{if(blocked||state.rows.length>=30)return;state.rows.push({type:'transfer',gas:'21000',count:'1'});save();render();$('operations').querySelectorAll('select')[state.rows.length-1].focus();};
$('networks').addEventListener('change',e=>{const el=e.target;if(el.dataset.network===undefined||blocked)return;const i=Number(el.dataset.network);if(el.dataset.key==='rate'){state.rates[i]=el.value;state.modes[i]='manual';state.times[i]=0;}else state.extras[i]=el.value;save();calculate();stamps();});
for(const key of ['price','buffer'])$(key).onchange=()=>{if(blocked)return;state[key]=$(key).value;if(key==='price')state.priceTime=0;save();calculate();stamps();};
$('language').onclick=()=>{state.lang=state.lang==='ru'?'en':'ru';$('networkStatus').textContent='';save();render();};
async function json(url,options={}){const control=new AbortController(),timer=setTimeout(()=>control.abort(),10000);try{const r=await fetch(url,{...options,signal:control.signal,credentials:'omit',referrerPolicy:'no-referrer'});if(!r.ok)throw Error('HTTP '+r.status);return await r.json();}finally{clearTimeout(timer);}}
async function rpc(i,method){const d=await json(endpoints[i],{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params:[]})});if(d.error)throw Error('RPC');return d.result;}
$('refresh').onclick=async()=>{if(busy||blocked)return;busy=true;$('refresh').disabled=true;$('networkStatus').textContent=t('loading');
 // Freeze editable inputs during the request, so a late response cannot replace a manual edit.
 document.querySelectorAll('input,select,#add,#language,.remove').forEach(el=>el.disabled=true);
 const tasks=await Promise.allSettled([...names.map(async(_,i)=>{const [chain,fee]=await Promise.all([rpc(i,'eth_chainId'),rpc(i,'eth_gasPrice')]);if(chain!==chainIds[i])throw Error('chain');return D.rpcGwei(fee);}),json('https://api.coinbase.com/v2/prices/ETH-USD/spot')]);
 // A storage conflict may arrive while network requests are pending.
 if(blocked){busy=false;return;}
 const failed=[];tasks.forEach((r,i)=>{if(r.status==='fulfilled'){if(i<3){state.rates[i]=r.value;state.modes[i]='live';state.times[i]=Date.now();}else{const p=r.value?.data;if(p?.base==='ETH'&&p?.currency==='USD'&&Number.isFinite(Number(p.amount))&&Number(p.amount)>0&&Number(p.amount)<=1e9){state.price=String(p.amount);state.priceTime=Date.now();}else failed.push('Coinbase');}}else failed.push(i<3?names[i]:'Coinbase');});
 $('networkStatus').textContent=failed.length?t('failed')+' '+failed.join(', '):t('fresh');busy=false;$('refresh').disabled=blocked;document.querySelectorAll('input,select,#language').forEach(el=>el.disabled=blocked);save();render();
};
function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('export').onclick=()=>{try{const all=results();const records=[['Gas planner v2',new Date().toISOString()],['Operation','Gas limit','Count'],...state.rows.map(r=>[t(r.type),r.gas,r.count]),[],['ETH USD',state.price||'unknown'],['Reserve %',state.buffer],[],['Network','Gas gwei','Extra ETH','Total ETH','Execution ETH','Reserve ETH','USD','Scope','Source timestamp'],...all.map((r,i)=>[names[i],state.rates[i],state.extras[i],D.eth(r.total),D.eth(r.execution),D.eth(r.total-r.subtotal),state.price?(Number(D.eth(r.total))*Number(state.price)).toFixed(2):'',i&&state.extras[i]===''?'Execution only; L2 fees unknown':'Includes entered fees',state.times[i]?new Date(state.times[i]).toISOString():state.modes[i]])];download('\uFEFF'+records.map(row=>row.map(D.csvCell).join(',')).join('\r\n'),'gas-plan.csv','text/csv;charset=utf-8');}catch(_){calculate();}};
window.addEventListener('storage',e=>{if(e.storageArea===localStorage&&(e.key===KEY||e.key===null)){blocked=true;$('networkStatus').textContent=t('conflict');document.querySelectorAll('input,select,button').forEach(el=>el.disabled=el.id!=='export'&&el.id!=='backupJson');}});
render();setInterval(stamps,60000);

const backupControls=document.createElement('div');backupControls.className='actions';$('saveStatus').after(backupControls);
const backupButton=document.createElement('button'),restoreButton=document.createElement('button'),backupInput=document.createElement('input');backupButton.id='backupJson';backupInput.type='file';backupInput.accept='.json,application/json';backupInput.hidden=true;backupControls.append(backupButton,restoreButton,backupInput);
function backupLabels(){backupButton.textContent=state.lang==='ru'?'Скачать копию JSON':'Download JSON backup';restoreButton.textContent=state.lang==='ru'?'Восстановить из копии':'Restore backup';}
backupLabels();$('language').addEventListener('click',backupLabels);
backupButton.onclick=()=>{try{D.restore({version:1,plan:state});download(JSON.stringify({version:1,plan:state},null,2),'gas-plan-backup.json','application/json');}catch(_){calculate();}};
restoreButton.onclick=()=>{if(!busy&&!blocked)backupInput.click();};
backupInput.onchange=async()=>{const file=backupInput.files[0];if(!file)return;try{if(file.size>100000)throw Error('size');const next=D.restore(JSON.parse(await file.text()));if(blocked||busy)return;if(!confirm(state.lang==='ru'?'Заменить текущий план данными из копии?':'Replace the current plan with this backup?'))return;state=next;save();render();backupLabels();}catch(_){$('networkStatus').textContent=state.lang==='ru'?'Некорректная копия. Текущий план сохранён.':'Invalid backup. Current plan was kept.';}finally{backupInput.value='';}};

</script>
</body></html>
